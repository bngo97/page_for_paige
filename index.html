<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page's Paige - Personal Message Board</title>
    <meta name="description" content="Personal messaging page for Brendan and Paige">
    <meta name="author" content="Brendan Ngo">
    <script src="https://cdn.tiny.cloud/1/s18f3z1sre4d0ylqnxxaen3h6dg81vilt7z4090qmqc735fs/tinymce/6/tinymce.min.js"
        referrerpolicy="origin"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</head>

<body>
    <h1 class="container">Page's Paige</h1>
    <div class="container emo_hearts">
        <img class="custom_image" height="50" width="50" src="./img/EmoEmoji.jpeg" />
        <div style="font-size: 40px; margin-left: -10px;">❤️</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="container">
            <textarea id="shared-message" name="message"></textarea>
            <div id="emoji-picker"></div>
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 8px;">
            <form id="paige-form" method="POST" action="https://formspree.io/f/xnqyavkk" style="display: inline;">
                <input type="hidden" name="message" id="paige-message">
                <input type="hidden" name="recipient" value="paige">
                <button class="button_style" type="submit">Send Paige a Message</button>
            </form>
            <form id="brendan-form" method="POST" action="https://formspree.io/f/xnqyavkk" style="display: inline;">
                <input type="hidden" name="message" id="brendan-message">
                <input type="hidden" name="recipient" value="brendan">
                <button class="button_style" type="submit">Send Brendan a Message</button>
            </form>
        </div>
    </div>
    <!-- <div style="padding:15px;"></div>
    <div class="container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/DEXDDyb6t2o?&autoplay=1&mute=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div> -->
    <!-- The Modal -->
    <div id="myModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="container">
                <iframe src="https://www.youtube.com/embed/DEXDDyb6t2o?&autoplay=1&mute=0&loop=1"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>

            </div>
        </div>
    </div>

    </div>
    <script>
        function isMobile() {
            return window.innerWidth <= 768;
        }

        tinymce.init({
            selector: '#shared-message',
            //plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount checklist mediaembed casechange export formatpainter pageembed linkchecker a11ychecker tinymcespellchecker permanentpen powerpaste advtable advcode editimage tinycomments tableofcontents footnotes mergetags autocorrect typography inlinecss',
            //toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat',
            tinycomments_mode: 'embedded',
            tinycomments_author: 'Author name',
            mergetags_list: [
                { value: 'First.Name', title: 'First Name' },
                { value: 'Email', title: 'Email' },
            ],
            height: isMobile() ? 250 : 437,
            width: '100%',
            max_width: 425,
        });

        // Handle form submissions
        document.getElementById('brendan-form').addEventListener('submit', function(e) {
            const content = tinymce.get('shared-message').getContent();
            document.getElementById('brendan-message').value = content;
        });

        document.getElementById('paige-form').addEventListener('submit', function(e) {
            const content = tinymce.get('shared-message').getContent();
            document.getElementById('paige-message').value = content;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("myModal");

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];
        // When the user clicks on <span> (x), close the modal
        span.onclick = function () {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function addText(event) {
            if (event.src) {
                tinymce.activeEditor.execCommand('mceInsertContent', false, '<img height="16" width="16" style="margin-bottom:-2px" src="' + event.src + '"/>');
            } else {
                tinymce.activeEditor.execCommand('mceInsertContent', false, event.native);
            }

            if (event.id === "fall-for-you") {
                modal.style.display = "block";
            }
        }
        const pickerOptions = {
            onEmojiSelect: addText,
            theme: "light",
            custom: [
                {
                    id: 'paige',
                    name: 'Paige\'s Emoji Set',
                    emojis: [
                        {
                            id: 'emo-brendan',
                            name: 'Emo Brendan',
                            keywords: ['emo-brendan'],
                            skins: [{ src: './img/EmoEmoji.jpeg' }],
                        },
                        {
                            id: 'emo-paige',
                            name: 'Emo Paige',
                            keywords: ['emo-paige'],
                            skins: [{ src: './img/EmoPaige.jpeg' }],
                        },
                        {
                            id: 'emo-cowboy',
                            name: 'Emo Cowboy',
                            keywords: ['emo-cowboy'],
                            skins: [{ src: './img/EmoCowboy.jpeg' }],
                        },
                        {
                            id: 'fall-for-you',
                            name: 'Fall For You',
                            keywords: ['fall-for-you'],
                            skins: [{ src: './img/FallForYou.jpeg' }],
                        },
                        {
                            id: 'angry-paige',
                            name: 'Angry Paige',
                            keywords: ['angry-paige'],
                            skins: [{ src: './img/AngryPaige.jpg' }],
                        },
                        {
                            id: 'kpop-paige',
                            name: 'Kpop Paige',
                            keywords: ['kpop-paige'],
                            skins: [{ src: './img/KpopPaige.jpg' }],
                        },
                        {
                            id: 'pretty-paige',
                            name: 'Pretty Paige',
                            keywords: ['pretty-paige'],
                            skins: [{ src: './img/PrettyPaige.jpg' }],
                        },
                        {
                            id: 'sunshine-paige',
                            name: 'Sunshine Paige',
                            keywords: ['sunshine-paige'],
                            skins: [{ src: './img/SunshinePaige.jpg' }],
                        },
                        {
                            id: 'heated-seat',
                            name: 'Heated Seat',
                            keywords: ['heated-seat'],
                            skins: [{ src: './img/HeatedSeat.jpeg' }],
                        },
                        {
                            id: 'octocat-enemy',
                            name: 'Octocat Enemy',
                            keywords: ['octocat-enemy'],
                            skins: [{ src: './img/Octocat_ENEMY.png' }],
                        },
                    ],
                },
            ],
            categories: ['paige', 'frequent', 'people', 'nature', 'foods', 'activity', 'places', 'objects', 'symbols', 'flags']
        }
        const picker = new EmojiMart.Picker(pickerOptions)
        document.getElementById("emoji-picker").appendChild(picker)
    </script>
    <style>
        body {
            margin: 4rem auto;
            padding: 0 2rem;
            background-color: white;
            font-family: sans-serif;
            max-width: 100%;
            overflow-x: hidden;
        }

        main {
            width: 100%;
        }

        h1 {
            text-align: center;
        }

        .button_style {
            /* background-color: white; */
            font-size: medium;
            padding: 6px 12px;
            /* border-radius: 8px; */
            text-align: center;
            white-space: nowrap;
        }

        .button_style:hover {
            cursor: pointer;
        }

        .container {
            display: flex;
            gap: 10px;
            flex-direction: row ltr;
            justify-content: center;
            max-width: 100%;
        }

        .emo_hearts {
            margin-top: -15px;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 5;
            /* Sit on top */
            padding-top: 100px;
            /* Location of the box */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgb(0, 0, 0);
            /* Fallback color */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        /* Modal Content */
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 600px;
            height: auto;
        }

        .modal-content iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        /* The Close Button */
        .close {
            color: #aaaaaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            body {
                margin: 2rem auto;
                padding: 0 1rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .container {
                max-width: 100%;
                flex-direction: column;
            }

            .button_style {
                font-size: small;
                padding: 8px 10px;
                width: 100%;
            }

            /* Stack buttons vertically on mobile */
            div[style*="display: flex"][style*="gap: 10px"] {
                flex-direction: column !important;
                gap: 8px !important;
                width: 100%;
            }

            div[style*="display: flex"][style*="gap: 10px"] form {
                width: 100%;
            }

            .modal {
                padding-top: 50px;
            }

            .modal-content {
                width: 95%;
                padding: 15px;
            }

            .emo_hearts {
                margin-top: -10px;
            }

            .custom_image {
                height: 40px !important;
                width: 40px !important;
            }

            /* Constrain emoji picker on mobile */
            #emoji-picker {
                max-width: 100%;
                overflow-x: auto;
            }

            #emoji-picker em-emoji-picker {
                width: 100% !important;
                max-width: 100% !important;
                height: 280px !important;
            }
        }

        @media (max-width: 480px) {
            body {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .button_style {
                font-size: small;
                padding: 10px 8px;
            }

            .modal-content {
                padding: 10px;
            }

            /* Even more compact emoji picker on small phones */
            #emoji-picker em-emoji-picker {
                height: 250px !important;
            }
        }
    </style>
</body>

</html>
